name: effective-occurrence-benchmark

on:
  push:
    branches:
      - experiment/effective-occurrence-weighting

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
          python3 -m pip install --break-system-packages brotli zstandard
      - name: Build and run experimental tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude \
            tests/effective_occurrence_tests.cpp -o effective-occurrence-tests
          ./effective-occurrence-tests
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude \
            tests/context_arithmetic_tests.cpp -o context-arithmetic-tests
          ./context-arithmetic-tests
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude \
            tests/prior_residual_tests.cpp -o prior-residual-tests
          ./prior-residual-tests
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude \
            tests/class_prior_tests.cpp -o class-prior-tests
          ./class-prior-tests
      - name: Build benchmarks
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude \
            examples/effective_occurrence_benchmark.cpp \
            -o effective-occurrence-benchmark
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude \
            examples/context_model_benchmark.cpp \
            -o context-model-benchmark
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude \
            examples/prior_residual_benchmark.cpp \
            -o prior-residual-benchmark
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude \
            examples/class_prior_benchmark.cpp \
            -o class-prior-benchmark
      - name: Run AEC benchmark
        run: |
          ./effective-occurrence-benchmark \
            include/ae_compression/compressor.hpp /bin/ls | tee aec-results.csv
      - name: Run contextual frequency benchmark
        run: |
          ./context-model-benchmark \
            include/ae_compression/compressor.hpp /bin/ls | tee context-results.csv
      - name: Run global-prior residual benchmark
        run: |
          ./prior-residual-benchmark \
            include/ae_compression/compressor.hpp /bin/ls | tee prior-residual-results.csv
      - name: Run class-conditioned prior benchmark
        run: |
          ./class-prior-benchmark \
            include/ae_compression/compressor.hpp /bin/ls | tee class-prior-results.csv
      - name: Run competitor benchmark
        run: |
          python3 tools/benchmark_competitors.py | tee competitor-results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: effective-occurrence-results
          path: |
            aec-results.csv
            context-results.csv
            prior-residual-results.csv
            class-prior-results.csv
            competitor-results.csv
            benchmark-data/
